name: Bootstrap project upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project
        run: |
          unzip -o .codex-upload/project.zip -d .
          rm -rf .codex-upload .github/workflows/bootstrap-project.yml
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Roblox telekinesis prototype"
          git push
